kind: wasmer.io/App.v0
name: elibrary-backend
owner: '2320801'
package: .
app_id: da_2OPIqt7Upgx0
capabilities:
  database:
    engine: postgres
annotations:
  anybuild.run/config:
    commands:
      start: node server.js
    edgejs_enable: true
